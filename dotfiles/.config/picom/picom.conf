# myi3 di manuel - v1.0

backend = "glx";
vsync = true;

shadow = false;
shadow-radius = 7;
shadow-offset-x = -7;
shadow-offset-y = -7;
shadow-opacity = 0.5;

shadow-exclude = [
  "name = 'Notification'",
  "class_g = 'dunst'",
  "class_g = 'i3-frame'",
  "class_g = 'i3bar'",
  "class_g = 'i3lock'",
  "window_type = 'dock'",
  "window_type = 'desktop'"
];

inactive-opacity = 0.90;
active-opacity = 1.0;
frame-opacity = 1.0;

fading = true;
fade-in-step = 0.5;
fade-out-step = 0.5;

use-damage = true;
detect-rounded-corners = true;
detect-client-opacity = true;
corner-radius = 0;

fade-exclude = [
  "class_g = 'i3lock'",
];

opacity-rule = [
  "100:class_g = 'i3lock'",
];
