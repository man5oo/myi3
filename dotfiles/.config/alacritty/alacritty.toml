# myi3 di manuel - v1.0

[general]
import = ["~/.config/alacritty/colors.toml"]
live_config_reload = true

[window]
padding = { x = 10, y = 10 }
opacity = 0.94
decorations = "Full"
dynamic_title = true

[font]
size = 6

[font.normal]
family = "RobotoMono Nerd Font"
style = "Regular"

[font.bold]
family = "RobotoMono Nerd Font"
style = "Bold"

[cursor]
style = { shape = "Underline", blinking = "On" }
