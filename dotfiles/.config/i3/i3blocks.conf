# i3 - Manuel - v2.9

separator_block_width=10
command=$HOME/.config/i3/blocks/$BLOCK_NAME
color=#E8EAED

#~ [appmenu]
#~ full_text= 
#~ command=$HOME/.config/rofi/scripts/app-launcher

#~ [settings]
#~ full_text= 
#~ command=i3-msg -q exec $HOME/.config/i3/scripts/config-menu

#~ [terminal]
#~ full_text= 
#~ command=i3-msg -q exec alacritty

#~ [browser]
#~ full_text=󰖟 
#~ command=i3-msg -q exec firefox

#~ [files]
#~ full_text= 
#~ command=i3-msg -q exec thunar ~/

#~ [text-editor]
#~ full_text= 
#~ command=i3-msg -q exec geany

#~ [separator]
#~ full_text="|"
#~ color=#35363A

[arch-update]
interval=3600
markup=pango
LABEL=   

[separator]
full_text="|"
color=#35363A

[bandwidth]
interval=5
INLABEL= 
OUTLABEL=  


[separator]
full_text="|"
color=#35363A

[cpu]
interval=10

[memory]
interval=10

[disk]
DIR=/
interval=30

[temperature]
interval=10
SENSOR_CHIP=acpitz-acpi-0
#SENSOR_CHIP=coretemp-isa-0000

[separator]
full_text="|"
color=#35363A

[volume]
interval=1
signal=10

[microphone]
interval=5

[webcam]
instance=/dev/video0
interval=5

[separator]
full_text="|"
color=#35363A

[backlight]
label=󰃠  
interval=2

[battery]
interval=10


[separator]
full_text="|"
color=#35363A

[date]
command=date '+%a %d/%m'
interval=1000

[time]
command=date '+%H:%M'
interval=5

[notifications]
full_text= 
command=dunstctl history-pop
interval=

[powermenu]
full_text= 
command=$HOME/.config/i3/scripts/power-menu
